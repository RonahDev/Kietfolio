version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. Database: PostgreSQL 16 Alpine
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: kietfolio-db
    environment:
      POSTGRES_DB: ${DB_NAME:-kietfolio_db}
      POSTGRES_USER: ${DB_USER:-kietfolio_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kietfolio_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./database/seeds:/docker-entrypoint-initdb.d/seeds:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kietfolio_user} -d ${DB_NAME:-kietfolio_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - kietfolio-network

  # ---------------------------------------------------------------------------
  # 2. Backend: Node.js Express TypeScript API
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: kietfolio-backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-kietfolio_db}
      DB_USER: ${DB_USER:-kietfolio_user}
      DB_PASSWORD: ${DB_PASSWORD:-kietfolio_secure_password_2026}
      JWT_SECRET: ${JWT_SECRET:-kietfolio-secure-super-jwt-secret-key-2026}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-kiet.maianh@gmail.com}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kietfolio-network

  # ---------------------------------------------------------------------------
  # 3. Frontend: React 19 Vite + Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    container_name: kietfolio-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - kietfolio-network

volumes:
  postgres_data:
    driver: local

networks:
  kietfolio-network:
    driver: bridge
